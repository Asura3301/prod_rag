name: prod-rag

services:
  api:
    build: .
    environment:
      RAG_ADMIN_TOKEN: ${RAG_ADMIN_TOKEN:-change-me}
      RAG_API_TOKEN: ${RAG_API_TOKEN:-change-me}
      REDIS_URL: redis://redis:6379/0
      RAG_VECTOR_STORE__PROVIDER: ${RAG_VECTOR_STORE_PROVIDER:-memory}
      RAG_VECTOR_STORE__URL: ${RAG_VECTOR_STORE_URL:-}
      POSTGRES_DSN: postgresql://rag:${POSTGRES_PASSWORD:-rag-local-only}@postgres:5432/rag
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["python", "scripts/run_worker.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["workers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket; s=socket.create_connection(('redis',6379),2); s.close()"]
      interval: 15s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    profiles: ["pgvector"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.15.4}
    volumes:
      - qdrant-data:/qdrant/storage
    profiles: ["qdrant"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
  qdrant-data:
