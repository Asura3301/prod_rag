name: prod-rag

x-rag-environment: &rag-environment
  RAG_RUNTIME_MODE: ${RAG_RUNTIME_MODE:-local}
  RAG_API_TOKEN: ${RAG_API_TOKEN:-}
  RAG_ADMIN_TOKEN: ${RAG_ADMIN_TOKEN:-}
  RAG_REDIS_URL: ${RAG_REDIS_URL:-redis://redis:6379/0}
  RAG_SQLITE_PATH: ${RAG_SQLITE_PATH:-/data/rag.sqlite3}
  RAG_INGESTION_ROOT: ${RAG_INGESTION_ROOT:-/data/ingestion}
  RAG_LLM__PROVIDER: ${RAG_LLM__PROVIDER:-local}
  RAG_LLM__MODEL: ${RAG_LLM__MODEL:-gpt-oss-20b}
  RAG_LLM__API_KEY: ${RAG_LLM__API_KEY:-}
  RAG_LLM__BASE_URL: ${RAG_LLM__BASE_URL:-http://host.docker.internal:1234/v1}
  RAG_LLM__TIMEOUT_SECONDS: ${RAG_LLM__TIMEOUT_SECONDS:-30}
  RAG_LLM__MAX_RETRIES: ${RAG_LLM__MAX_RETRIES:-3}
  RAG_LLM__TEMPERATURE: ${RAG_LLM__TEMPERATURE:-0}
  RAG_LLM__MAX_TOKENS: ${RAG_LLM__MAX_TOKENS:-2048}
  RAG_EMBEDDINGS__PROVIDER: ${RAG_EMBEDDINGS__PROVIDER:-local}
  RAG_EMBEDDINGS__MODEL: ${RAG_EMBEDDINGS__MODEL:-BAAI/bge-m3}
  RAG_EMBEDDINGS__DIMENSIONS: ${RAG_EMBEDDINGS__DIMENSIONS:-1024}
  RAG_EMBEDDINGS__BATCH_SIZE: ${RAG_EMBEDDINGS__BATCH_SIZE:-64}
  RAG_VECTOR_STORE__PROVIDER: ${RAG_VECTOR_STORE__PROVIDER:-qdrant}
  RAG_VECTOR_STORE__URL: ${RAG_VECTOR_STORE__URL:-http://qdrant:6333}
  RAG_VECTOR_STORE__API_KEY: ${RAG_VECTOR_STORE__API_KEY:-}
  RAG_VECTOR_STORE__INDEX_NAME: ${RAG_VECTOR_STORE__INDEX_NAME:-documents}
  RAG_VECTOR_STORE__NAMESPACE: ${RAG_VECTOR_STORE__NAMESPACE:-default}

services:
  api:
    build: .
    environment:
      <<: *rag-environment
      POSTGRES_DSN: postgresql://rag:${POSTGRES_PASSWORD:-rag-local-only}@postgres:5432/rag
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["python", "scripts/run_worker.py"]
    environment:
      <<: *rag-environment
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["workers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket; s=socket.create_connection(('redis',6379),2); s.close()"]
      interval: 15s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    profiles: ["pgvector"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.15.4}
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    profiles: ["qdrant"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
  qdrant-data:
